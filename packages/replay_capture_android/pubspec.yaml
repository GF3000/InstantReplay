name: replay_capture_android
description: Native Android capture pipeline for InstantReplay (Camera2, GL fan-out, H.264, fMP4 ring buffer).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.instantreplay.replay_capture_android
        pluginClass: ReplayCaptureAndroidPlugin
