# Launcher icon (concept "Bucle"). Sources and how to re-render them: branding/README.md.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 29
  image_path: "branding/png/icon_legacy.png"
  adaptive_icon_background: "#FFC107"
  adaptive_icon_foreground: "branding/png/icon_foreground.png"
  adaptive_icon_monochrome: "branding/png/icon_monochrome.png"
  # The foreground PNGs are already the full 108 dp canvas, so no extra inset.
  adaptive_icon_foreground_inset: 0
  # The web icons are copied by hand (branding/README.md): the maskable ones need the full-bleed image.
  web:
    generate: false
