name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please check docs/PLAN-v0.1.md and docs/SPEC.md first; the feature may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way? Describe the situation (sport, training or match, who uses the app).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Affected role
      multiple: true
      options:
        - Camera
        - Viewer (Android app)
        - Web viewer
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
