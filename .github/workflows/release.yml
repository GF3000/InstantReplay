name: Release

# Builds the release APKs (with the offline web Viewer inside) and attaches them to a *draft*
# GitHub Release, which a maintainer reviews and publishes by hand.
#
# Triggers: pushing a tag like v0.1.0, or running the workflow manually (APKs as an artifact only).
# A tag must match the version in app/pubspec.yaml. Re-running a tag's workflow replaces the
# APKs of its release instead of failing. Release notes come from docs/releases/<tag>.md when it
# exists, otherwise from the merged pull requests.
#
# Signing: these repository secrets sign with the project key. A tag build fails without them, or
# when the APKs end up signed with another key; a manual run without them uses the debug key:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.1
  # SHA-256 of the InstantReplay release certificate. Not a secret: anyone can read it from an APK.
  EXPECTED_CERT_SHA256: 29e12ce265d32d7616ae6d838799c338f671cdee495af89073d6a06bd9d5a5d7

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (workspace root)
        run: flutter pub get

      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version="$(grep '^version:' app/pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $version"
            exit 1
          fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::No signing secrets: a release must be signed with the project key."
            exit 1
          else
            echo "No signing secrets: the APK will be signed with the debug key."
          fi

      - name: Build release APK with the web Viewer
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # arm64 (almost every phone since 2017) is less than half the size of a universal APK.
        # The universal one is built too, for older 32-bit phones.
        # One retry: dependency and Gradle downloads occasionally fail on hosted runners.
        run: |
          retry() { "$@" || { echo "::warning::Retrying: $*"; sleep 30; "$@"; }; }
          retry bash tool/build_apk.sh --release --split-per-abi
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/
          (cd app && retry flutter build apk --release)
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/

      - name: Check the APK signatures
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        # With the project key, every APK must carry the project certificate (EXPECTED_CERT_SHA256).
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
            if [ "$HAS_KEY" = true ] && ! grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
              echo "::error::$apk is not signed with the InstantReplay key"
              exit 1
            fi
          done

      - name: Name the APKs after the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(grep '^version:' app/pubspec.yaml | cut -d' ' -f2)-${GITHUB_SHA::7}"
          mv dist/app-arm64-v8a-release.apk "dist/instant-replay-$version-arm64.apk"
          mv dist/app-release.apk "dist/instant-replay-$version-universal.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          elif [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.apk --draft --title "InstantReplay $GITHUB_REF_NAME" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --draft --generate-notes --title "InstantReplay $GITHUB_REF_NAME"
          fi
