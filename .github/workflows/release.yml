name: Release

# Builds the release APK (with the offline web Viewer inside) and attaches it to a *draft*
# GitHub Release, which a maintainer reviews and publishes by hand.
#
# Triggers: pushing a tag like v0.1.0, or running the workflow manually (APK as an artifact only).
#
# Signing: set these repository secrets to sign with the project key; without them the APK is
# signed with the debug key (fine for testing, but Android won't update it over a properly
# signed install):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (workspace root)
        run: flutter pub get

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the APK will be signed with the debug key."
          fi

      - name: Build release APK with the web Viewer
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # arm64 (almost every phone since 2017) is less than half the size of a universal APK.
        # The universal one is built too, for older 32-bit phones.
        run: |
          bash tool/build_apk.sh --release --split-per-abi
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/
          (cd app && flutter build apk --release)
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/

      - name: Name the APKs after the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(grep '^version:' app/pubspec.yaml | cut -d' ' -f2)-${GITHUB_SHA::7}"
          mv dist/app-arm64-v8a-release.apk "dist/instant-replay-$version-arm64.apk"
          mv dist/app-release.apk "dist/instant-replay-$version-universal.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --draft --generate-notes --title "InstantReplay $GITHUB_REF_NAME"
